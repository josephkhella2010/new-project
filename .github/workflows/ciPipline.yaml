name: Pipeline

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # =========================
      # Backend
      # =========================

      # =========================
      # Create Backend .env
      # =========================
      - name: Create backend .env
        run: |
          echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> backend/.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> backend/.env
          echo "PORT=${{ secrets.PORT }}" >> backend/.env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> backend/.env
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Build Backend
        working-directory: backend
        run: npm run build

      - name: Run backend tests
        working-directory: ./backend
        run: npm test

      # =========================
      # Frontend
      # =========================
      - name: Install Frontend Dependencies
        working-directory: frontend/project
        run: npm ci

      - name: Build Frontend
        working-directory: frontend/project
        run: npm run build
      # =========================
      # Docker
      # =========================
      - name: Build Docker Images
        run: docker compose build

      - name: Start Docker Containers
        run: docker compose up -d

      - name: Check Running Containers
        run: docker ps
      - name: Wait for Backend
        run: sleep 10

      - name: Check Docker Containers
        run: docker compose ps

      - name: Show Backend Logs
        run: docker compose logs backend

      - name: Check Backend Health
        run: curl --fail http://localhost:5000/ || exit 1

      - name: Stop Docker Containers
        if: always()
        run: docker compose down

      # =========================
      # Final
      # =========================
      - name: List Files
        run: ls -la

      - name: Pipeline Completed
        run: echo "✅ Pipeline completed successfully!"
